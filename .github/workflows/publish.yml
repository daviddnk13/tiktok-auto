name: Auto First Paycheck Math
on:
  workflow_dispatch:
  schedule:
    # 15:30 UTC ≈ mañana en EE. UU. (ET/CT) y 23:30 UTC ≈ tarde-noche:
    # las dos franjas de publicación del canal (2 videos/día).
    - cron: "30 15 * * *"
    - cron: "30 23 * * *"
permissions:
  contents: write
concurrency:
  group: publish-tiktok
  cancel-in-progress: false
jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg, fonts and deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Generate and Upload Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: python main.py
      - name: Save rendered video if the run failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-fallido
          path: work/final_video.mp4
          if-no-files-found: ignore
      - name: Save plan and history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historial.json estrategia.json
          git commit -m "chore: update plan and history" || exit 0
          git pull --rebase
          git push
